name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: ${{ vars.ENABLE_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
      - name: Install
        run: |
          pip install -U pip
          pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          PYTHONPATH: packages/core:packages/audio:packages/embed:packages/index:packages/match:packages/library:services/api:services/indexer:cli:.
        run: pytest -q --cov=packages --cov=services
