[project]
name = "clawhum"
version = "0.1.0"
description = "Query-by-humming with CLAP audio embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjay" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "structlog>=24.4",
  "typer>=0.26.4",
  "rich>=15.0.0",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "librosa>=0.11.0",
  "soundfile>=0.13.1",
  "httpx>=0.27",
  "tenacity>=9.0",
  "faiss-cpu>=1.14.2 ; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.45",
  "accelerate>=1.13.0",
]
sentry = [
  "sentry-sdk[fastapi]>=2.18",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.15.15",
  "mypy>=1.13",
  "httpx>=0.27",
  "sentry-sdk[fastapi]>=2.18",
]

[project.scripts]
clawhum = "clawhum_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/clawhum_core",
  "packages/audio/clawhum_audio",
  "packages/embed/clawhum_embed",
  "packages/index/clawhum_index",
  "packages/match/clawhum_match",
  "packages/library/clawhum_library",
  "services/api/clawhum_api",
  "services/indexer/clawhum_indexer",
  "cli/clawhum_cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
